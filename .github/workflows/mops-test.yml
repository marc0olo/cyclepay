name: verification gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # So the gate can be run on demand against any branch, which is otherwise
  # impossible: a push to a feature branch matches none of the triggers above.
  workflow_dispatch:

jobs:
  # Motoko lint + unit suites. Fast, so it stays its own job and fails early.
  motoko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: caffeinelabs/setup-mops@v1
        with:
          mops-version: 2

      - name: install mops packages
        run: mops install

      # -Werror: M0145 (non-exhaustive match) is a warning, so without this a new
      # `Types.Owner` case compiles green and traps at runtime on the authz path.
      # Not in mops.toml, because `mops test` passes --hide-warnings and moc
      # rejects the pair.
      - name: type-check and lint (-Werror)
        run: mops check -- -Werror

      - name: run unit tests
        run: mops test

      # The committed .did is both the embedded candid:service metadata and the
      # frontend's bindgen source. A stale one means the frontend typechecks
      # against an interface the canister does not have.
      - name: committed .did is current
        run: |
          mops build
          git diff --exit-code -- src/backend/dist/backend.did

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install
        run: npm --prefix src/frontend ci

      # Build first: it regenerates the bindings the typecheck needs.
      - name: build (regenerates bindings)
        run: npm --prefix src/frontend run build

      - name: typecheck
        run: npm --prefix src/frontend run typecheck

      - name: unit tests
        run: npm --prefix src/frontend run test

      # The brand rules that do not need eyes: banned characters and vocabulary,
      # hardcoded colour, and the no-auto-dark rule.
      - name: brand lint
        run: bash scripts/brand-lint.sh

      # The shipping bundle must not carry the test-only fixture hook. Vite's
      # dead-code elimination is what guarantees it, and DCE is a compiler
      # behaviour rather than a promise, so it is checked against the built bytes.
      - name: no test hooks in the shipping bundle
        run: |
          if grep -rl "__cyclepayFixtures" src/frontend/dist; then
            echo "::error::the fixture hook is present in src/frontend/dist"
            exit 1
          fi

      # Issue #6. The cascade-and-layout bugs jsdom cannot see: it has neither,
      # so `el.hidden` reads true for an element that is plainly on screen. Also
      # the paint-level ones no assertion reaches, via committed `-linux`
      # screenshot baselines (test/browser/visual.spec.ts). Serves a build of the
      # frontend; no local network or deployed canister needed.
      - name: install browser deps
        run: npm --prefix test/browser ci

      - name: install chromium
        run: npx --prefix test/browser playwright install --with-deps chromium

      - name: browser specs
        run: npm --prefix test/browser test

      # The screenshot diffs are the only failure here you cannot read from a log.
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test/browser/test-results/
          retention-days: 7

  # The go-live bar (spec §9). ubuntu-latest because the IC replica's memory
  # tracker hard-asserts 4096-byte pages: x86_64 Linux and macOS are fine, arm64
  # Linux guests with 16 KiB pages are not.
  #
  # `npm test`, never `npx vitest run` — the latter skips pretest, which fetches
  # the sha256-pinned wasms and rebuilds the backend, so it would silently test a
  # stale wasm and pass.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: caffeinelabs/setup-mops@v1
        with:
          mops-version: 2

      - name: install mops packages
        run: mops install

      - name: install integration deps
        run: npm --prefix test/integration ci

      # ⚠️ **CI ran a SUBSET of the gate's steps, and this is the gap that mattered
      # twice.** The committed bindings can be stale while every CI job passes: this job
      # typechecks against whatever is in the checkout, so a stale binding is invisible to
      # it — and a comment-only Motoko edit moves both generated artifacts, because moc
      # emits doc comments into the `.did`.
      #
      # It belongs in THIS job and needs no backend build: it regenerates from the
      # committed `.did` (present in the checkout) using this suite's own
      # `@icp-sdk/bindgen` devDependency, installed above. Paired with the motoko job's
      # "committed .did is current", the two together mean the bindings match the code.
      #
      # Before the typecheck, because a typecheck against stale declarations is checking
      # the wrong interface.
      - name: committed bindings match the .did
        run: bash scripts/check-bindings.sh

      - name: typecheck
        run: npm --prefix test/integration run typecheck

      - name: PocketIC suite
        run: npm --prefix test/integration test
