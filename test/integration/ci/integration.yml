name: pocketic integration

on:
  push:
    branches:
      - main
      - master
      - task-12-integration
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: caffeinelabs/setup-mops@v1
        with:
          mops-version: 2

      - name: install mops packages
        run: mops install

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install suite dependencies
        working-directory: test/integration
        run: npm ci

      - name: run PocketIC suite (builds backend via pretest)
        working-directory: test/integration
        run: npm test
